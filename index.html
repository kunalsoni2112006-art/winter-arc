<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Arc Tracker</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ff9800;
      text-align: center;
      margin-bottom: 5px;
      font-size: 1.5rem;
    }

    .subtitle {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: center;
    }

    .rank-card {
      background: #1e1e1e;
      border: 1px solid #ff9800;
      border-radius: 10px;
      padding: 12px 20px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .rank-title {
      color: #4caf50;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .month-container {
      width: 100%;
      max-width: 420px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .month-title {
      color: #ff9800;
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
      text-align: center;
    }

    .day-header {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffb74d;
      padding-bottom: 5px;
    }

    .day-box {
      background: #2a2a2a;
      border-radius: 6px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 55px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .day-box:hover {
      border-color: #ff9800;
    }

    .day-box.empty {
      background: transparent;
      cursor: default;
      border: none;
    }

    .day-number {
      font-size: 0.75rem;
      color: #fff;
      font-weight: bold;
    }

    .workout-type {
      font-size: 0.6rem;
      color: #ffb74d;
      font-weight: 600;
      margin: 2px 0;
    }

    .workout-type.rest {
      color: #777;
    }

    .day-box input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #ff9800;
      cursor: pointer;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 88%;
      max-width: 360px;
      text-align: center;
      border: 1px solid #ff9800;
      box-sizing: border-box;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      color: #ff9800;
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .exercise-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      text-align: left;
    }

    .ex-name {
      color: #ffb74d;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .ex-name:hover {
      color: #ffa726;
    }

    .ex-sets {
      color: #888;
      font-size: 0.8rem;
    }

    /* Nested Animation GIF Modal */
    .animation-gif {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
      margin: 15px 0;
    }

    .close-btn {
      background: #ff9800;
      color: #000;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>🔥 WINTER ARC TRACKER 🔥</h1>
  <div class="subtitle">6-Day PPL Routine (Oct - Dec 2026)<br><small>(Tap any date box to view workout routine & animations)</small></div>

  <div class="rank-card">
    <div>Rank: <span id="rankTitle" class="rank-title">Recruit ⚡</span></div>
    <div style="font-size:0.85rem; color:#aaa; margin-top:4px;">Workouts Done: <span id="doneCount">0</span> / 78</div>
  </div>

  <!-- Calendar Container -->
  <div id="calendar"></div>

  <!-- Modal Popup for Day Routine -->
  <div id="routineModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalDateTitle" class="modal-title">Workout Routine</h3>
      <div id="modalRoutineList"></div>
      <button class="close-btn" onclick="closeModal('routineModal')">Close</button>
    </div>
  </div>

  <!-- Modal Popup for Exercise Animation Demo -->
  <div id="animModal" class="modal-overlay" style="z-index: 1100;">
    <div class="modal-content">
      <h3 id="animTitle" class="modal-title" style="color: #4caf50;">Exercise Demo</h3>
      <img id="animGif" class="animation-gif" src="" alt="Workout Animation">
      <div id="animDesc" style="font-size: 0.85rem; color: #bbb; margin-bottom: 10px;"></div>
      <button class="close-btn" onclick="closeModal('animModal')">Back to Routine</button>
    </div>
  </div>

  <script>
    const monthsData = [
      { name: "October 2026", days: 31, startDay: 3 }, // Thu start
      { name: "November 2026", days: 30, startDay: 6 }, // Sun start
      { name: "December 2026", days: 31, startDay: 1 }  // Tue start
    ];

    const weekHeaders = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    // Exercise database with stable demonstration GIF assets
    const exerciseDatabase = {
      "Bench Press": {
        sets: "3 Sets x 8-12 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press/images/0.jpg",
        desc: "Lie on bench, grip barbell slightly wider than shoulder-width, lower to chest and press up."
      },
      "Overhead Press": {
        sets: "3 Sets x 8-10 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Shoulder_Press/images/0.jpg",
        desc: "Press barbell overhead from upper chest level while keeping core tight."
      },
      "Incline Dumbbell Press": {
        sets: "3 Sets x 10-12 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Press/images/0.jpg",
        desc: "Press dumbbells upward on an inclined bench targeting upper chest."
      },
      "Tricep Pushdown": {
        sets: "4 Sets x 12-15 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown/images/0.jpg",
        desc: "Push cable attachment downward by extending elbows completely."
      },
      "Pull Ups": {
        sets: "3 Sets x Max reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullup/images/0.jpg",
        desc: "Pull body upward until chin clears the pull-up bar."
      },
      "Barbell Row": {
        sets: "3 Sets x 8-10 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bent_Over_Row/images/0.jpg",
        desc: "Bend over at hips with flat back, pull barbell toward lower chest."
      },
      "Lat Pulldown": {
        sets: "3 Sets x 10-12 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Lat_Pulldown/images/0.jpg",
        desc: "Pull bar down toward upper chest, focusing on squeezing lats."
      },
      "Bicep Curls": {
        sets: "4 Sets x 12 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Biceps_Curl/images/0.jpg",
        desc: "Curl weights upward toward shoulders keeping elbows locked at sides."
      },
      "Squats": {
        sets: "3 Sets x 8-10 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Full_Squat/images/0.jpg",
        desc: "Lower hips back and down with barbell across upper back, then drive up."
      },
      "Deadlift": {
        sets: "3 Sets x 5 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Deadlift/images/0.jpg",
        desc: "Lift barbell off floor by extending hips and knees with a straight back."
      },
      "Leg Press": {
        sets: "3 Sets x 10-12 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Sled_Leg_Press/images/0.jpg",
        desc: "Press weighted platform away using legs while keeping lower back flat."
      },
      "Calf Raises": {
        sets: "4 Sets x 15-20 reps",
        gif: "https://images.weserv.nl/?url=https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Calf_Raise/images/0.jpg",
        desc: "Raise heels up high onto toes, hold briefly, then lower slowly."
      }
    };

    const routineMapping = {
      "PUSH": ["Bench Press", "Overhead Press", "Incline Dumbbell Press", "Tricep Pushdown"],
      "PULL": ["Pull Ups", "Barbell Row", "Lat Pulldown", "Bicep Curls"],
      "LEGS": ["Squats", "Deadlift", "Leg Press", "Calf Raises"],
      "REST": []
    };

    function renderCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendarEl.innerHTML = '';

      let workoutSeqCount = 0;

      monthsData.forEach((m, mIdx) => {
        const monthDiv = document.createElement('div');
        monthDiv.className = 'month-container';
        
        let html = `<h3 class="month-title">${m.name}</h3><div class="calendar-grid">`;
        weekHeaders.forEach(h => html += `<div class="day-header">${h}</div>`);

        for (let i = 0; i < m.startDay; i++) {
          html += `<div class="day-box empty"></div>`;
        }

        for (let day = 1; day <= m.days; day++) {
          const dayOfWeekIndex = (m.startDay + day - 1) % 7;
          let workoutType = "REST";

          if (dayOfWeekIndex !== 6) {
            const pplCycle = ["PUSH", "PULL", "LEGS"];
            workoutType = pplCycle[workoutSeqCount % 3];
            workoutSeqCount++;
          }

          const isRest = workoutType === "REST";
          const dayKey = `day_${mIdx}_${day}`;
          const isChecked = localStorage.getItem(dayKey) === 'true';

          html += `
            <div class="day-box" onclick="openDayRoutine('${m.name}', ${day}, '${workoutType}')">
              <div class="day-number">${day}</div>
              <div class="workout-type ${isRest ? 'rest' : ''}">${workoutType}</div>
              ${!isRest ? `<input type="checkbox" id="${dayKey}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleCheck('${dayKey}')">` : '<div style="height:15px;"></div>'}
            </div>
          `;
        }

        html += `</div>`;
        monthDiv.innerHTML = html;
        calendarEl.appendChild(monthDiv);
      });

      updateStats();
    }

    function toggleCheck(key) {
      const checkbox = document.getElementById(key);
      localStorage.setItem(key, checkbox.checked);
      updateStats();
    }

    function updateStats() {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('day_') && localStorage.getItem(key) === 'true') {
          count++;
        }
      }

      document.getElementById('doneCount').innerText = count;

      let rank = "Recruit ⚡";
      if (count >= 10) rank = "Hypertrophy Adept ⚡";
      if (count >= 25) rank = "Iron Disciple 🔥";
      if (count >= 45) rank = "Arc Master 💪";
      if (count >= 60) rank = "Unstoppable Beast 👑";

      document.getElementById('rankTitle').innerText = rank;
    }

    function openDayRoutine(monthName, dayNum, type) {
      document.getElementById('modalDateTitle').innerText = `${type} - ${dayNum} ${monthName}`;
      
      let listHtml = `<div style="font-size:0.85rem; color:#ff9800; margin-bottom:10px; font-weight:bold;">Tap any exercise for demo animation:</div>`;
      
      if (type === "REST") {
        listHtml += `<div class="exercise-row"><div><div class="ex-name">Rest & Recovery</div><div class="ex-sets">Hydrate, Stretch & Sleep 💤</div></div></div>`;
      } else {
        routineMapping[type].forEach(exName => {
          const exInfo = exerciseDatabase[exName];
          listHtml += `
            <div class="exercise-row">
              <div>
                <div class="ex-name" onclick="openExerciseDemo('${exName}')">${exName}</div>
                <div class="ex-sets">${exInfo.sets}</div>
              </div>
            </div>
          `;
        });
      }

      document.getElementById('modalRoutineList').innerHTML = listHtml;
      document.getElementById('routineModal').style.display = 'flex';
    }

    function openExerciseDemo(exName) {
      const info = exerciseDatabase[exName];
      document.getElementById('animTitle').innerText = exName;
      document.getElementById('animGif').src = info.gif;
      document.getElementById('animDesc').innerText = info.desc;
      document.getElementById('animModal').style.display = 'flex';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    renderCalendar();
  </script>
</body>
</html>

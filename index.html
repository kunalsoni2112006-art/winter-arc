<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Ultimate Tracker (2026-2027)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --border: #30363d;
            --rest-color: #1f6feb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Stats & Rank Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-weight: bold;
            font-size: 1rem;
            color: var(--accent);
        }

        /* Calendar Section */
        .calendar-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .month-select {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .day-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: bold;
            padding-bottom: 4px;
        }

        .day-cell {
            padding: 8px 0;
            background-color: rgba(240, 246, 252, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
            min-height: 44px;
            justify-content: center;
        }

        .day-cell:hover {
            border-color: var(--accent);
        }

        .day-cell.selected {
            border: 2px solid var(--text-primary);
        }

        .day-cell.rest {
            background-color: rgba(31, 111, 235, 0.15);
            border-color: var(--rest-color);
        }

        .day-cell.completed {
            background-color: rgba(35, 134, 54, 0.25);
            border-color: var(--accent);
        }

        .day-cell.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .day-badge {
            font-size: 0.55rem;
            padding: 1px 3px;
            border-radius: 3px;
            background: rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        /* Workout View Panel */
        .workout-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .workout-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Progress Bar */
        .progress-bar-bg {
            background-color: var(--border);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Exercise Cards */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .exercise-card {
            background-color: rgba(22, 27, 34, 0.6);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            min-height: 180px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        .exercise-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .exercise-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-title {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .exercise-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .exercise-meta {
            display: flex;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .meta-badge {
            background-color: rgba(240, 246, 252, 0.08);
            padding: 3px 6px;
            border-radius: 4px;
        }

        /* Weekly Physique Progress (Local Storage Only) */
        .photo-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .photo-section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .photo-upload-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        input[type="file"] {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .photo-card {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 1;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rest-msg {
            text-align: center;
            padding: 30px;
            color: var(--rest-color);
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Winter Arc Tracker</h1>
        <p>PPL Training Protocol (2026 - 2027)</p>
    </header>

    <!-- Stats & Rank Bar -->
    <div class="stats-bar">
        <div class="stat-item">
            <span>Rank</span>
            <span class="stat-value" id="user-rank">Novice</span>
        </div>
        <div class="stat-item">
            <span>Current Streak</span>
            <span class="stat-value" id="user-streak">0 Days</span>
        </div>
        <div class="stat-item">
            <span>Workouts Done</span>
            <span class="stat-value" id="total-completed">0</span>
        </div>
    </div>

    <!-- Calendar Section with Month Selector -->
    <div class="calendar-section">
        <div class="calendar-header">
            <span id="calendar-title">Calendar</span>
            <select id="month-selector" class="month-select" onchange="changeMonth()">
                <!-- Populated dynamically via JS -->
            </select>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
    </div>

    <!-- Active Workout View Panel -->
    <div class="workout-panel">
        <h3 id="panel-title">Select a date from calendar</h3>
        <div class="progress-bar-bg" id="progress-bar-wrapper">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div id="workout-content" class="exercise-list">
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Click any date above to check scheduled exercises and log your progress.</p>
        </div>
    </div>

    <!-- Weekly Physique Progress (Local Storage Only) -->
    <div class="photo-section">
        <h3>🔒 Private Weekly Physique Log (Local Storage)</h3>
        <div class="photo-upload-row">
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="savePhoto()" style="padding: 6px 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Save Pic</button>
        </div>
        <div class="photo-grid" id="photo-grid"></div>
    </div>

    <script>
        const workoutLibrary = {
            "Push 1": [
                { id: "p1_1", name: "Barbell Bench Press", image: "Workout/Bench press.jpg", sets: "3-4", reps: "8-12" },
                { id: "p1_2", name: "Incline Dumbbell Press", image: "Workout/Incline dumbell press.jpg", sets: "3-4", reps: "10-12" },
                { id: "p1_3", name: "Overhead Press", image: "Workout/Overhead press.jpg", sets: "3", reps: "8-10" },
                { id: "p1_4", name: "Lateral Raises", image: "Workout/Lateral raises.jpg", sets: "4", reps: "12-15" }
            ],
            "Pull 1": [
                { id: "pu1_1", name: "Lat Pulldown", image: "Workout/Lat pulldown.jpg", sets: "4", reps: "10-12" },
                { id: "pu1_2", name: "Barbell Rows", image: "Workout/barbell rows.jpg", sets: "3-4", reps: "8-10" },
                { id: "pu1_3", name: "Seated Cable Rows", image: "Workout/cable rows.jpg", sets: "3-4", reps: "10-12" },
                { id: "pu1_4", name: "Face Pulls", image: "Workout/Face pulls.jpg", sets: "3", reps: "15" }
            ],
            "Leg 1": [
                { id: "l1_1", name: "Leg Curl / Hamstring Curl", image: "Workout/Leg curl.jpg", sets: "3-4", reps: "10-12" },
                { id: "l1_2", name: "Plank (Core)", image: "Workout/Plank.gif", sets: "3", reps: "60 sec" }
            ],
            "Push 2": [
                { id: "p2_1", name: "Triceps Pulldown", image: "Workout/Triceps pulldown.jpg", sets: "3", reps: "10-12" },
                { id: "p2_2", name: "Overhead Triceps Extension", image: "Workout/Overhead triceps extension.jpg", sets: "3", reps: "10-12" },
                { id: "p2_3", name: "Bench Dips", image: "Workout/Tricep dips.jpg", sets: "3", reps: "Failure" }
            ],
            "Pull 2": [
                { id: "pu2_1", name: "Biceps Curl", image: "Workout/biceps curl.jpg", sets: "3", reps: "10-12" },
                { id: "pu2_2", name: "Hammer Curl", image: "Workout/hammer curl.jpg", sets: "3", reps: "10-12" },
                { id: "pu2_3", name: "Preacher Curl", image: "Workout/preacher curl.jpg", sets: "3", reps: "10-12" }
            ],
            "Leg 2": [
                { id: "l2_1", name: "Leg Curl / Hamstring Curl", image: "Workout/Leg curl.jpg", sets: "3-4", reps: "10-12" },
                { id: "l2_2", name: "Plank (Core)", image: "Workout/Plank.gif", sets: "3", reps: "60 sec" }
            ]
        };

        const rotationOrder = ["Push 1", "Pull 1", "Leg 1", "Push 2", "Pull 2", "Leg 2"];

        // State Management
        let workoutLogs = JSON.parse(localStorage.getItem('winterArcLogs')) || {}; 
        let savedPhotos = JSON.parse(localStorage.getItem('winterArcPhotos')) || [];
        
        // Default view: Current Year & Month (Oct 2026 baseline)
        let currentDate = new Date();
        let selectedYear = currentDate.getFullYear();
        let selectedMonth = currentDate.getMonth(); // 0-11
        if (selectedYear < 2026) { selectedYear = 2026; selectedMonth = 9; } // Default fallback to Oct 2026

        let selectedDateKey = `${selectedYear}-${selectedMonth}-${currentDate.getDate()}`;

        // Continuous sequence calculator starting from Oct 1, 2026 as baseline index 0
        const baselineDate = new Date(2026, 9, 1);

        function getWorkoutTypeForDate(year, month, day) {
            let targetDate = new Date(year, month, day);
            if (targetDate.getDay() === 0) return "Rest"; // Sunday Rest
            if (targetDate < baselineDate) return "Rest"; // Before Winter Arc start

            // Count working days between baseline and target date
            let count = 0;
            let d = new Date(baselineDate);
            while (d <= targetDate) {
                if (d.getDay() !== 0 && d < targetDate) {
                    count++;
                }
                d.setDate(d.getDate() + 1);
            }
            return rotationOrder[count % rotationOrder.length];
        }

        function initMonthSelector() {
            const selector = document.getElementById('month-selector');
            selector.innerHTML = '';

            const months = [
                "October 2026", "November 2026", "December 2026",
                "January 2027", "February 2027", "March 2027", "April 2027",
                "May 2027", "June 2027", "July 2027", "August 2027",
                "September 2027", "October 2027", "November 2027", "December 2027"
            ];

            let index = 0;
            for (let y = 2026; y <= 2027; y++) {
                let startM = (y === 2026) ? 9 : 0; // Oct for 2026, Jan for 2027
                let endM = (y === 2026) ? 11 : 11;
                for (let m = startM; m <= endM; m++) {
                    let opt = document.createElement('option');
                    opt.value = `${y}-${m}`;
                    opt.innerText = months[index++];
                    if (y === selectedYear && m === selectedMonth) {
                        opt.selected = true;
                    }
                    selector.appendChild(opt);
                }
            }
        }

        function changeMonth() {
            const val = document.getElementById('month-selector').value.split('-');
            selectedYear = parseInt(val[0]);
            selectedMonth = parseInt(val[1]);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-title').innerText = `${monthNames[selectedMonth]} ${selectedYear}`;

            const daysHeader = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
            daysHeader.forEach(d => {
                const headerCell = document.createElement('div');
                headerCell.className = 'day-name';
                headerCell.innerText = d;
                grid.appendChild(headerCell);
            });

            // First day offset (Mon start)
            let firstDayIndex = (new Date(selectedYear, selectedMonth, 1).getDay() + 6) % 7;
            for (let i = 0; i < firstDayIndex; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            let totalDays = new Date(selectedYear, selectedMonth + 1, 0).getDate();
            for (let i = 1; i <= totalDays; i++) {
                const cell = document.createElement('div');
                const wType = getWorkoutTypeForDate(selectedYear, selectedMonth, i);
                const dateKey = `${selectedYear}-${selectedMonth}-${i}`;
                
                let isCompleted = workoutLogs[dateKey] && workoutLogs[dateKey].completed;
                let isRest = wType === "Rest";
                let isSelected = selectedDateKey === dateKey;

                cell.className = `day-cell ${isRest ? 'rest' : ''} ${isCompleted ? 'completed' : ''} ${isSelected ? 'selected' : ''}`;
                cell.innerHTML = `<span>${i}</span><span class="day-badge">${isRest ? 'REST' : wType}</span>`;
                cell.onclick = () => selectDate(selectedYear, selectedMonth, i);
                grid.appendChild(cell);
            }
            updateStats();
        }

        function selectDate(year, month, day) {
            selectedDateKey = `${year}-${month}-${day}`;
            renderCalendar();
            renderWorkoutPanel(year, month, day);
        }

        function renderWorkoutPanel(year, month, day) {
            const wType = getWorkoutTypeForDate(year, month, day);
            const titleEl = document.getElementById('panel-title');
            const contentEl = document.getElementById('workout-content');
            const progressFill = document.getElementById('progress-fill');
            const progressWrapper = document.getElementById('progress-bar-wrapper');
            const dateKey = `${year}-${month}-${day}`;

            if (!workoutLogs[dateKey]) {
                workoutLogs[dateKey] = { type: wType, checked: {}, completed: false };
            }

            const monthShort = new Date(year, month).toLocaleString('default', { month: 'short' });

            if (wType === "Rest") {
                titleEl.innerHTML = `${monthShort} ${day}, ${year} — Rest Day 🛌`;
                progressWrapper.style.display = 'none';
                contentEl.innerHTML = `<div class="rest-msg">Enjoy your recovery today! Muscle grows while you rest. 💪</div>`;
                return;
            }

            progressWrapper.style.display = 'block';
            titleEl.innerHTML = `${monthShort} ${day}, ${year} — ${wType}`;
            
            const exercises = workoutLibrary[wType] || [];
            contentEl.innerHTML = '';

            exercises.forEach(ex => {
                let isChecked = workoutLogs[dateKey].checked[ex.id] || false;
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${ex.image}" alt="${ex.name}" loading="lazy">
                    </div>
                    <div class="exercise-info">
                        <div class="exercise-header-row">
                            <span class="exercise-title">${ex.name}</span>
                            <input type="checkbox" class="exercise-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleExercise('${dateKey}', '${ex.id}')">
                        </div>
                        <div class="exercise-meta">
                            <span class="meta-badge">Sets: ${ex.sets}</span>
                            <span class="meta-badge">Reps: ${ex.reps}</span>
                        </div>
                    </div>
                `;
                contentEl.appendChild(card);
            });
            updateDayProgress(dateKey);
        }

        function toggleExercise(dateKey, exId) {
            let log = workoutLogs[dateKey];
            log.checked[exId] = !log.checked[exId];

            const exercises = workoutLibrary[log.type];
            const allChecked = exercises.every(ex => log.checked[ex.id]);
            log.completed = allChecked;

            localStorage.setItem('winterArcLogs', JSON.stringify(workoutLogs));
            renderCalendar();
            updateDayProgress(dateKey);
        }

        function updateDayProgress(dateKey) {
            let log = workoutLogs[dateKey];
            const exercises = workoutLibrary[log.type];
            const checkedCount = exercises.filter(ex => log.checked[ex.id]).length;
            const pct = Math.round((checkedCount / exercises.length) * 100);
            document.getElementById('progress-fill').style.width = `${pct}%`;
        }

        function updateStats() {
            let totalDone = 0;
            for (let key in workoutLogs) {
                if (workoutLogs[key].completed) totalDone++;
            }

            // Streak calculation over recent days
            let streak = 0;
            let d = new Date();
            for (let i = 0; i < 60; i++) {
                let k = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                let w = getWorkoutTypeForDate(d.getFullYear(), d.getMonth(), d.getDate());
                if (workoutLogs[k] && workoutLogs[k].completed) {
                    streak++;
                } else if (w !== "Rest" && d <= new Date()) {
                    // break streak if a working day was missed
                    // keeping active buffer
                }
                d.setDate(d.getDate() - 1);
            }

            document.getElementById('total-completed').innerText = totalDone;
            document.getElementById('user-streak').innerText = `${streak} Days`;

            let rank = "Novice";
            if (totalDone >= 5) rank = "Bronze 🥉";
            if (totalDone >= 15) rank = "Silver 🥈";
            if (totalDone >= 30) rank = "Gold 🥇";
            if (totalDone >= 50) rank = "Winter Arc Beast ⚡";
            document.getElementById('user-rank').innerText = rank;
        }

        // LocalStorage Photo Handler
        function savePhoto() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savedPhotos.push({ date: new Date().toLocaleDateString(), data: e.target.result });
                    localStorage.setItem('winterArcPhotos', JSON.stringify(savedPhotos));
                    renderPhotos();
                    fileInput.value = '';
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function deletePhoto(index) {
            savedPhotos.splice(index, 1);
            localStorage.setItem('winterArcPhotos', JSON.stringify(savedPhotos));
            renderPhotos();
        }

        function renderPhotos() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            savedPhotos.forEach((photo, idx) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${photo.data}" alt="Progress">
                    <button class="photo-delete" onclick="deletePhoto(${idx})">×</button>
                `;
                grid.appendChild(card);
            });
        }

        // Initial Initialization
        initMonthSelector();
        renderCalendar();
        renderPhotos();
        // Load today's workout by default
        selectDate(selectedYear, selectedMonth, currentDate.getDate());
    </script>
</body>
</html>

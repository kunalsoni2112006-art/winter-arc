<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Arc Tracker</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #ff9800;
      text-align: center;
      margin-bottom: 5px;
      font-size: 1.5rem;
    }

    .subtitle {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: center;
    }

    .rank-card {
      background: #1e1e1e;
      border: 1px solid #ff9800;
      border-radius: 10px;
      padding: 12px 20px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .rank-title {
      color: #4caf50;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .month-container {
      width: 100%;
      max-width: 420px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .month-title {
      color: #ff9800;
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
      text-align: center;
    }

    .day-header {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ffb74d;
      padding-bottom: 5px;
    }

    .day-box {
      background: #2a2a2a;
      border-radius: 6px;
      padding: 6px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
    }

    .day-box.empty {
      background: transparent;
    }

    .day-number {
      font-size: 0.75rem;
      color: #fff;
      font-weight: bold;
    }

    .workout-type {
      font-size: 0.65rem;
      color: #ffb74d;
      font-weight: 600;
      margin: 2px 0;
    }

    .workout-type.rest {
      color: #777;
    }

    .day-box input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff9800;
      cursor: pointer;
    }

    .routine-container {
      width: 100%;
      max-width: 420px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .exercise-list {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
    }

    .exercise-item {
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a2a;
    }

    .exercise-name {
      color: #ffb74d;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.9rem;
    }

    .exercise-detail {
      font-size: 0.8rem;
      color: #888;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 340px;
      text-align: center;
      border: 1px solid #ff9800;
      box-sizing: border-box;
    }

    .modal-title {
      color: #ff9800;
      margin-top: 0;
      font-size: 1.1rem;
    }

    .modal-gif {
      width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 8px;
      margin: 15px 0;
      background: #121212;
    }

    .close-btn {
      background: #ff9800;
      color: #000;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🔥 WINTER ARC TRACKER 🔥</h1>
  <div class="subtitle">6-Day PPL Routine (Oct - Dec 2026)<br><small>(Tap exercise name for demo animation)</small></div>

  <div class="rank-card">
    <div>Rank: <span id="rankTitle" class="rank-title">Recruit ⚡</span></div>
    <div style="font-size:0.85rem; color:#aaa; margin-top:4px;">Workouts Done: <span id="doneCount">0</span> / 79</div>
  </div>

  <!-- Calendar Container -->
  <div id="calendar"></div>

  <!-- Exercise Demo Routines -->
  <div class="routine-container">
    <h3 style="color:#ff9800; margin-top:0;">🏋️ Exercise Demos</h3>
    <ul class="exercise-list">
      <li class="exercise-item"><span class="exercise-name" onclick="openDemo('Bench Press')">Bench Press</span><span class="exercise-detail">Push</span></li>
      <li class="exercise-item"><span class="exercise-name" onclick="openDemo('Overhead Press')">Overhead Press</span><span class="exercise-detail">Push</span></li>
      <li class="exercise-item"><span class="exercise-name" onclick="openDemo('Pull Ups')">Pull Ups</span><span class="exercise-detail">Pull</span></li>
      <li class="exercise-item"><span class="exercise-name" onclick="openDemo('Barbell Row')">Barbell Row</span><span class="exercise-detail">Pull</span></li>
      <li class="exercise-item"><span class="exercise-name" onclick="openDemo('Squats')">Squats</span><span class="exercise-detail">Legs</span></li>
      <li class="exercise-item"><span class="exercise-name" onclick="openDemo('Deadlift')">Deadlift</span><span class="exercise-detail">Legs</span></li>
    </ul>
  </div>

  <!-- Modal Popup -->
  <div id="demoModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle" class="modal-title">Exercise Name</h3>
      <img id="modalGif" class="modal-gif" src="" alt="Workout Animation">
      <button class="close-btn" onclick="closeDemo()">Close</button>
    </div>
  </div>

  <script>
    const monthsData = [
      { name: "October 2026", days: 31, startDay: 3 },
      { name: "November 2026", days: 30, startDay: 6 },
      { name: "December 2026", days: 31, startDay: 1 }
    ];

    const pplPattern = ["PUSH", "PULL", "LEGS", "PUSH", "PULL", "LEGS", "REST"];
    const weekHeaders = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    // Direct Working GIF URLs (Wikimedia / Public Stable Sources)
    const gifMap = {
      "Bench Press": "https://upload.wikimedia.org/wikipedia/commons/b/b8/Bench-press-1.gif",
      "Overhead Press": "https://upload.wikimedia.org/wikipedia/commons/8/82/Shoulder-press-1.gif",
      "Pull Ups": "https://upload.wikimedia.org/wikipedia/commons/1/1a/Pull-up-1.gif",
      "Barbell Row": "https://upload.wikimedia.org/wikipedia/commons/5/58/Bent-over-row-1.gif",
      "Squats": "https://upload.wikimedia.org/wikipedia/commons/d/d4/Squat-1.gif",
      "Deadlift": "https://upload.wikimedia.org/wikipedia/commons/0/07/Deadlift-1.gif"
    };

    function renderCalendar() {
      const calendarEl = document.getElementById('calendar');
      calendarEl.innerHTML = '';

      monthsData.forEach((m, mIdx) => {
        const monthDiv = document.createElement('div');
        monthDiv.className = 'month-container';
        
        let html = `<h3 class="month-title">${m.name}</h3><div class="calendar-grid">`;
        weekHeaders.forEach(h => html += `<div class="day-header">${h}</div>`);

        for (let i = 0; i < m.startDay; i++) {
          html += `<div class="day-box empty"></div>`;
        }

        for (let day = 1; day <= m.days; day++) {
          const dayOfWeekIndex = (m.startDay + day - 1) % 7;
          const workoutType = pplPattern[dayOfWeekIndex];
          const isRest = workoutType === "REST";
          const dayKey = `day_${mIdx}_${day}`;
          const isChecked = localStorage.getItem(dayKey) === 'true';

          html += `
            <div class="day-box">
              <div class="day-number">${day}</div>
              <div class="workout-type ${isRest ? 'rest' : ''}">${workoutType}</div>
              ${!isRest ? `<input type="checkbox" id="${dayKey}" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${dayKey}')">` : ''}
            </div>
          `;
        }

        html += `</div>`;
        monthDiv.innerHTML = html;
        calendarEl.appendChild(monthDiv);
      });

      updateStats();
    }

    function toggleCheck(key) {
      const checkbox = document.getElementById(key);
      localStorage.setItem(key, checkbox.checked);
      updateStats();
    }

    function updateStats() {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('day_') && localStorage.getItem(key) === 'true') {
          count++;
        }
      }

      document.getElementById('doneCount').innerText = count;

      let rank = "Recruit ⚡";
      if (count >= 10) rank = "Hypertrophy Adept ⚡";
      if (count >= 25) rank = "Iron Disciple 🔥";
      if (count >= 45) rank = "Arc Master 💪";
      if (count >= 65) rank = "Unstoppable Beast 👑";

      document.getElementById('rankTitle').innerText = rank;
    }

    function openDemo(name) {
      document.getElementById('modalTitle').innerText = name;
      document.getElementById('modalGif').src = gifMap[name] || "https://upload.wikimedia.org/wikipedia/commons/b/b8/Bench-press-1.gif";
      document.getElementById('demoModal').style.display = 'flex';
    }

    function closeDemo() {
      document.getElementById('demoModal').style.display = 'none';
    }

    renderCalendar();
  </script>
</body>
</html>

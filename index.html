<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Workout & Progress Tracker</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Calendar Section */
        .calendar-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .day-cell {
            padding: 8px 0;
            background-color: rgba(240, 246, 252, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }

        .day-cell.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: bold;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .progress-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-bg {
            background-color: var(--border);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Exercise Cards */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image-container {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            min-height: 220px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 240px;
            object-fit: contain;
        }

        .exercise-info {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .exercise-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exercise-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .exercise-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .exercise-meta {
            display: flex;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .meta-badge {
            background-color: rgba(240, 246, 252, 0.08);
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Winter Arc Tracker</h1>
        <p>October – December 2026 PPL Routine</p>
    </header>

    <!-- Calendar Streak Section -->
    <div class="calendar-section">
        <div class="calendar-header">
            <span>📅 October 2026 Tracker</span>
        </div>
        <div class="calendar-grid" id="calendar-grid">
            <!-- Dynamic Calendar Days -->
        </div>
    </div>

    <!-- Workout Completion Progress -->
    <div class="progress-container">
        <div class="progress-title">
            <span>Daily Workout Progress</span>
            <span id="progress-text">0%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('push', event)">Push</button>
        <button class="tab-btn" onclick="switchTab('pull', event)">Pull</button>
        <button class="tab-btn" onclick="switchTab('legsAndCore', event)">Legs & Core</button>
    </div>

    <!-- Content Area -->
    <div id="exercise-container" class="exercise-list"></div>

    <script>
        const workoutData = {
            push: [
                { id: "push_1", name: "Barbell Bench Press", image: "Workout/Bench press.jpg", sets: "3-4", reps: "8-12" },
                { id: "push_2", name: "Incline Dumbbell Press", image: "Workout/Incline dumbell press.jpg", sets: "3-4", reps: "10-12" },
                { id: "push_3", name: "Overhead Press", image: "Workout/Overhead press.jpg", sets: "3", reps: "8-10" },
                { id: "push_4", name: "Lateral Raises", image: "Workout/Lateral raises.jpg", sets: "4", reps: "12-15" },
                { id: "push_5", name: "Triceps Pulldown", image: "Workout/Triceps pulldown.jpg", sets: "3", reps: "10-12" },
                { id: "push_6", name: "Overhead Triceps Extension", image: "Workout/Overhead triceps extension.jpg", sets: "3", reps: "10-12" },
                { id: "push_7", name: "Bench Dips / Tricep Dips", image: "Workout/Tricep dips.jpg", sets: "3", reps: "Failure" }
            ],
            pull: [
                { id: "pull_1", name: "Lat Pulldown", image: "Workout/Lat pulldown.jpg", sets: "4", reps: "10-12" },
                { id: "pull_2", name: "Barbell Rows", image: "Workout/barbell rows.jpg", sets: "3-4", reps: "8-10" },
                { id: "pull_3", name: "Seated Cable Rows", image: "Workout/cable rows.jpg", sets: "3-4", reps: "10-12" },
                { id: "pull_4", name: "Face Pulls", image: "Workout/Face pulls.jpg", sets: "3", reps: "15" },
                { id: "pull_5", name: "Biceps Curl", image: "Workout/biceps curl.jpg", sets: "3", reps: "10-12" },
                { id: "pull_6", name: "Hammer Curl", image: "Workout/hammer curl.jpg", sets: "3", reps: "10-12" },
                { id: "pull_7", name: "Preacher Curl", image: "Workout/preacher curl.jpg", sets: "3", reps: "10-12" }
            ],
            legsAndCore: [
                { id: "leg_1", name: "Leg Curl / Hamstring Curl", image: "Workout/Leg curl.jpg", sets: "3-4", reps: "10-12" },
                { id: "core_1", name: "Plank", image: "Workout/Plank.gif", sets: "3", reps: "60 sec" }
            ]
        };

        let currentCategory = 'push';
        let completedExercises = JSON.parse(localStorage.getItem('completedExercises')) || {};
        let completedDays = JSON.parse(localStorage.getItem('completedDays')) || {};

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 31; i++) {
                const day = document.createElement('div');
                day.className = `day-cell ${completedDays[i] ? 'active' : ''}`;
                day.innerText = i;
                day.onclick = () => toggleDay(i);
                grid.appendChild(day);
            }
        }

        function toggleDay(day) {
            completedDays[day] = !completedDays[day];
            localStorage.setItem('completedDays', JSON.stringify(completedDays));
            renderCalendar();
        }

        function switchTab(category, evt) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.target.classList.add('active');
            renderExercises();
        }

        function toggleExercise(id) {
            completedExercises[id] = !completedExercises[id];
            localStorage.setItem('completedExercises', JSON.stringify(completedExercises));
            updateProgress();
        }

        function updateProgress() {
            const currentList = workoutData[currentCategory];
            const completedCount = currentList.filter(item => completedExercises[item.id]).length;
            const percentage = Math.round((completedCount / currentList.length) * 100) || 0;
            
            document.getElementById('progress-fill').style.width = `${percentage}%`;
            document.getElementById('progress-text').innerText = `${percentage}%`;
        }

        function renderExercises() {
            const container = document.getElementById('exercise-container');
            const items = workoutData[currentCategory];
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                const isChecked = completedExercises[item.id] ? 'checked' : '';
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${item.image}" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="exercise-info">
                        <div class="exercise-header-row">
                            <span class="exercise-title">${item.name}</span>
                            <input type="checkbox" class="exercise-checkbox" ${isChecked} onchange="toggleExercise('${item.id}')">
                        </div>
                        <div class="exercise-meta">
                            <span class="meta-badge">Sets: ${item.sets}</span>
                            <span class="meta-badge">Reps: ${item.reps}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            updateProgress();
        }

        // Init
        renderCalendar();
        renderExercises();
    </script>
</body>
</html>
